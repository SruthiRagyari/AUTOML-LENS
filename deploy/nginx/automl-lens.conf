# AutoML-Lens production reverse proxy.
#
# Terminates public HTTPS and forwards to the FastAPI backend on 127.0.0.1:8000.
# Replace DOMAIN with the real hostname before enabling (certbot rewrites the
# port-80 block into the ACME + redirect pair).
#
# Two settings matter for this application:
#   client_max_body_size - allows the 1 GB dataset upload (MAX_DATASET_SIZE_MB=1024)
#   proxy_request_buffering off - streams the body straight to uvicorn instead of
#                          spooling up to 1 GB to nginx's disk before forwarding,
#                          which pairs with the backend's 1 MB chunked writes.

server {
    listen 80;
    server_name DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 1 GB uploads must pass through untouched.
    client_max_body_size 2048m;
    client_body_timeout  3600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not buffer large uploads or long-running responses.
        proxy_request_buffering off;
        proxy_buffering off;

        # Model training / Optuna HPO requests can take a long time.
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}