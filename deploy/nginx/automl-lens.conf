# AutoML-Lens production reverse proxy.
#
# Serves the built React/Vite SPA and forwards API traffic to the FastAPI backend
# on 127.0.0.1:8000, all from one public origin. Same-origin means the browser
# never makes a cross-origin request, so CORS does not apply and VITE_API_BASE_URL
# stays empty (relative '/api').
#
# Replace DOMAIN with the real hostname before enabling.
#
# Three settings matter for this application:
#   client_max_body_size - allows the 1 GB dataset upload (MAX_DATASET_SIZE_MB=1024)
#   proxy_request_buffering off - streams the body straight to uvicorn instead of
#                          spooling up to 1 GB to nginx's disk before forwarding,
#                          which pairs with the backend's 1 MB chunked writes.
#   try_files ... /index.html - SPA deep links such as /dashboard/9 must not 404.

server {
    listen 80;
    server_name DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/automl-lens;
    index index.html;

    # 1 GB uploads must pass through untouched.
    client_max_body_size 2048m;
    client_body_timeout  3600s;

    # ---- API and backend-served artifacts -------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not buffer large uploads or long-running responses.
        proxy_request_buffering off;
        proxy_buffering off;

        # Model training / Optuna HPO requests can take a long time.
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # Report HTML and batch prediction CSVs are served by the backend under /api
    # (mounted there so they cannot shadow the SPA /reports and /predictions
    # routes), so the /api location above already covers them.

    # ---- static frontend ------------------------------------------------
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: every other path renders the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}